name: Nally conversation memory

on:
  push:
    branches:
      - nally/voice-first-web
  pull_request:
    branches:
      - nally/voice-first-web
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Test memory retrieval and conversation recovery
        run: bun --config .github/bunfig-ci.toml test packages/core/test/nally-memory-retrieval.test.ts

      - name: Test Telegram webhook and response handling
        run: bun --config .github/bunfig-ci.toml test packages/nally-telegram/src
